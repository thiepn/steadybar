name: Prepare verified profile system 2.0.1
on:
  push:
    branches: [transfer/profile-system-v201]
    paths: [.github/workflows/prepare-profile-system-v201.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: transfer/profile-system-v201
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify exact patch payload and release baseline
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/profile-v201-{01..04}.b64 | base64 --decode > /tmp/profile-v201.patch.xz
          echo '0f53da2900a63e65172d7d450177d912725f1baa9c5dabca2c6b759110c987b5  /tmp/profile-v201.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/profile-v201.patch.xz > /tmp/profile-v201.patch
          git fetch origin main fix/profile-system-v201
          test "$(git rev-parse origin/main)" = 2eced72ccbe3d86e6107c77d783d30cde86c63c8
          test "$(git rev-parse origin/fix/profile-system-v201)" = 2eced72ccbe3d86e6107c77d783d30cde86c63c8
          git checkout --detach 2eced72ccbe3d86e6107c77d783d30cde86c63c8
          git apply --check /tmp/profile-v201.patch
          git apply --index /tmp/profile-v201.patch
      - name: Clean install and full code verification
        run: npm ci && npm run check
      - name: Verify browser test sources compile
        run: python3 -m py_compile tests/profiles.py tests/ui_polish.py tests/colors.py tests/workbench.py tests/ci_render.py tests/ci_native.py
      - name: Commit verified application tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden practice profile selection, history and recovery'
          git push origin HEAD:fix/profile-system-v201
      # retry after correcting the transport payload; no application code lives on this branch
