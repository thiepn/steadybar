name: Apply verified workbench
on:
  push:
    branches: [design/practice-workbench]
    paths: [.github/workflows/apply-workbench.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply hash-verified source edits
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, shutil
          assert os.environ['GITHUB_REF'] == 'refs/heads/design/practice-workbench'
          root = pathlib.Path.cwd()
          payload = base64.b64decode(''.join((root / '.transfer' / f'part-{i}').read_text() for i in range(7)), validate=True)
          assert hashlib.sha256(payload).hexdigest() == '96cf971a75cfb051cb671c39c756ce2ea99111aafd61880b132536ae35dd67a7'
          raw = lzma.decompress(payload)
          assert hashlib.sha256(raw).hexdigest() == '7f7c301eba4c85f5ff5c01b0977da13194e5c309b670c6437d66264c3e21b8fd'
          records = json.loads(raw)
          assert len(records) == 35
          seen = set()
          staged = []
          for record in records:
              name = record['path']
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert name not in seen
              seen.add(name)
              assert name.startswith(('src/', 'public/', 'tests/', 'docs/')) or name in ('README.md', 'CHANGELOG.md', 'package.json', 'package-lock.json', '.github/workflows/pages.yml', '.github/workflows/source-snapshot.yml')
              dest = root / path
              old = dest.read_bytes() if dest.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == record['base'], f'Unexpected source revision: {name}'
              if record.get('delete'):
                  staged.append((dest, None))
                  continue
              lines = (old or b'').decode('utf-8').splitlines(True)
              for start, end, text in reversed(record['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [text]
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == record['result'], f'Hash mismatch: {name}'
              staged.append((dest, new))
          for dest, content in staged:
              if content is None:
                  dest.unlink()
              else:
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(content)
                  print(hashlib.sha256(content).hexdigest(), dest.relative_to(root))
          shutil.rmtree(root / '.transfer')
          (root / '.github/workflows/apply-workbench.yml').unlink()
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit verified source to design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign Steadybar as a focused practice workbench'
          git push origin HEAD:design/practice-workbench
