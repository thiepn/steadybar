name: Prepare Steadybar 2.1.1 final audit
on:
  push:
    branches: [fix/v210-postrelease-audit]
    paths: [.github/workflows/prepare-v211-final-audit.yml]
permissions:
  contents: write
jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v210-postrelease-audit
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Normalize current first-read test marker for one-shot patcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/profiles.test.mjs');s=p.read_text()
          current="test('first read is not awarded again when the same material is restarted or revisited',()=>{"
          marker="test('first-read provenance turns repeats into repeat reading automatically',()=>{"
          if s.count(current)!=1: raise SystemExit('current first-read test marker missing or duplicated')
          p.write_text(s.replace(current,marker,1))
          PY
      - name: Apply final audit fixes
        run: python3 tools/apply_v211_reading_plan_fix.py
      - name: Restore canonical first-read test name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/profiles.test.mjs');s=p.read_text()
          marker="test('first-read provenance turns repeats into repeat reading automatically',()=>{"
          current="test('first read is not awarded again when the same material is restarted or revisited',()=>{"
          if s.count(marker)!=1: raise SystemExit('patched first-read test marker missing or duplicated')
          p.write_text(s.replace(marker,current,1))
          PY
      - name: Remove one-shot patcher
        run: git rm tools/apply_v211_reading_plan_fix.py
      - name: Verify final candidate
        run: |
          git diff --check
          npm ci
          npm run check
          python3 -m py_compile tests/courses.py tests/profiles.py tests/ui_polish.py tests/colors.py tests/workbench.py tests/ci_render.py tests/ci_native.py tests/e2e.py
      - name: Commit verified final audit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve sight-reading provenance and starter-plan metadata'
          git push origin HEAD:fix/v210-postrelease-audit
