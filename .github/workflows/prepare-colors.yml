name: Prepare neutral color update
on:
  push:
    branches: [update/neutral-color-transfer]
    paths: [.github/workflows/prepare-colors.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update/neutral-color-transfer
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply the focused source changes
        run: python3 scripts/neutral-colors-update.py
      - name: Verify source and production build
        run: npm ci && npm run check
      - name: Commit application sources without workflow changes
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows
          rm scripts/neutral-colors-update.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f dist
          git commit -m 'Add neutral dark backgrounds and sixteen independent accents'
          git archive --format=zip --prefix=steadybar/ HEAD -o /tmp/steadybar-colors-source.zip
          git push origin HEAD:update/neutral-color-transfer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steadybar-colors-source
          path: /tmp/steadybar-colors-source.zip
          retention-days: 2
