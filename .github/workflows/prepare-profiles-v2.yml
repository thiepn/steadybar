name: Prepare verified practice profiles v2
on:
  push:
    branches: [transfer/practice-profiles-v2]
    paths: [.github/workflows/prepare-profiles-v2.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: transfer/practice-profiles-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify exact source payload and branch baseline
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/source-{01..09}.b64 | base64 --decode > /tmp/steadybar-v2.patch.xz
          echo 'a3afac7ab8ee9bf3421a26ad8f490fd44693bba2f19d557079f7f3d16b2d4a12  /tmp/steadybar-v2.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/steadybar-v2.patch.xz > /tmp/steadybar-v2.patch
          git fetch origin feat/practice-profiles-v2
          test "$(git rev-parse origin/feat/practice-profiles-v2)" = bc144e9f0a8834fe7dafc26d15cde07578e9424d
          git checkout --detach bc144e9f0a8834fe7dafc26d15cde07578e9424d
          git apply --check /tmp/steadybar-v2.patch
          git apply --index /tmp/steadybar-v2.patch
          test "$(git write-tree)" = a97719f596d2e793ad5bd18a09fa758dc302be25
      - name: Install exact dependencies and verify source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check | tee /tmp/steadybar-v2-check.log
      - name: Commit verified application without transfer tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement instrument-specific practice profiles v2 with safe legacy migration'
          git push origin HEAD:feat/practice-profiles-v2
          git archive --format=zip --prefix=steadybar/ HEAD -o /tmp/steadybar-v2-source.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('/tmp/steadybar-v2-source.zip', 'a', ZIP_DEFLATED) as archive:
              for path in Path('dist').rglob('*'):
                  if path.is_file(): archive.write(path, 'steadybar/' + str(path))
              archive.write('/tmp/steadybar-v2-check.log', 'steadybar/docs/qa/clean-install-check.log')
          PY
      - name: Preserve clean-install evidence and runnable source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steadybar-v2-prepared-source
          path: |
            /tmp/steadybar-v2-source.zip
            /tmp/steadybar-v2-check.log
          retention-days: 7
