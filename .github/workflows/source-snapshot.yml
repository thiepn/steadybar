name: Source snapshot
on:
  push:
    branches: [design/practice-workbench]
    paths: [.github/workflows/source-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git archive --format=zip --prefix=steadybar/ HEAD -o steadybar-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: steadybar-source
          path: steadybar-source.zip
          retention-days: 2
