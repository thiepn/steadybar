name: Prepare Steadybar 2.1.1 profile waits
on:
  push:
    branches: [fix/v210-postrelease-audit]
    paths: [.github/workflows/prepare-v211-profile-waits.yml]
permissions:
  contents: write
jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BUNDLED_BROWSER: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v210-postrelease-audit
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python3 tools/apply_v211_profile_wait_fix.py
      - run: git rm tools/apply_v211_profile_wait_fix.py
      - run: |
          git diff --check
          npm ci
          npm run check
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python tests/run_suite.py tests/profiles.py
      - name: Commit verified regression waits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wait for confirmation-backed profile writes in browser regressions'
          git push origin HEAD:fix/v210-postrelease-audit
